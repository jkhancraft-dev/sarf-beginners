name: Build Sarf Beginners Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'conjugation.js'
      - 'conjugation_core.js'
      - 'conjugation_data.json'
      - 'conjugation_database.json'
      - 'data/**'
      - 'textbook/**'
      - 'icon/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sarf Beginners
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare offline web bundle
        run: |
          mkdir -p www
          rsync -a ./ www/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='android/' \
            --exclude='www/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json' \
            --exclude='*.md' \
            --exclude='verification/'

          test -f www/index.html
          test -f www/data/verbs.json
          test -f www/textbook/index.html
          test -f www/conjugation_database.json

      - name: Create Android project
        run: npx cap add android

      - name: Copy bundled app into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sarf-beginners-v11-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
